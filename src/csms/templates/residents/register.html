{% extends "base.html" %}

{% block title %}Register Resident - CSMS{% endblock %}

{% block content %}
<h1>Register Resident</h1>

{% if errors %}
<div class="flash error">
    <ul>
        {% for error in errors %}
            <li>{{ error }}</li>
        {% endfor %}
    </ul>
</div>
{% endif %}

<form method="POST" action="/residents/register">
    <div class="form-group">
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="first_name" value="{{ resident.first_name or '' }}">
    </div>

    <div class="form-group">
        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" name="last_name" value="{{ resident.last_name or '' }}">
    </div>

    <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" name="address" value="{{ resident.address or '' }}">
    </div>

    <div class="form-group">
        <label for="contact_number">Contact Number</label>
        <input type="text" id="contact_number" name="contact_number" value="{{ resident.contact_number or '' }}">
    </div>

    <div class="form-group">
        <label for="email">Email</label>
        <input type="text" id="email" name="email" value="{{ resident.email or '' }}">
    </div>

    <div style="margin-top: 20px;">
        <button type="submit" class="btn">Register Resident</button>
        <a href="/residents" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
