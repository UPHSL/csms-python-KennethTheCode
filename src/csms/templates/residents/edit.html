{% extends "base.html" %}

{% block title %}Edit Resident - CSMS{% endblock %}

{% block content %}
<h1>Edit Resident</h1>

{% if errors %}
<div class="flash error">
    <ul>
        {% for error in errors %}
            <li>{{ error }}</li>
        {% endfor %}
    </ul>
</div>
{% endif %}

<form method="POST" action="/residents/{{ resident.id }}/edit">
    <div class="form-group">
        <label>Resident ID</label>
        <input type="text" value="{{ resident.id }}" disabled>
    </div>

    <div class="form-group">
        <label>Status</label>
        <input type="text" value="{{ resident.status }}" disabled>
    </div>

    <div class="form-group">
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="first_name" value="{{ resident.first_name }}">
    </div>

    <div class="form-group">
        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" name="last_name" value="{{ resident.last_name }}">
    </div>

    <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" name="address" value="{{ resident.address }}">
    </div>

    <div class="form-group">
        <label for="contact_number">Contact Number</label>
        <input type="text" id="contact_number" name="contact_number" value="{{ resident.contact_number }}">
    </div>

    <div class="form-group">
        <label for="email">Email</label>
        <input type="text" id="email" name="email" value="{{ resident.email }}">
    </div>

    <div style="margin-top: 20px;">
        <button type="submit" class="btn">Save Changes</button>
        <a href="/residents" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
